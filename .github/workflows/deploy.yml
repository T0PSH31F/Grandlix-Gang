name: Deploy NFP Fleet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check flake format
        run: nix fmt -- --check
      - name: Flake check
        run: nix flake check
        
  deploy:
    needs: validate
    runs-on: [self-hosted, nixos, deployer]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Luffy
        run: clan machines update luffy
      - name: Deploy Z0r0
        run: clan machines update z0r0
