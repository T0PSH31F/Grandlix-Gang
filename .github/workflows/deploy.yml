name: Validate & Deploy NFP Fleet

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Check flake format
        run: nix fmt -- --check
      - name: Deadnix lint check
        run: nix run nixpkgs#deadnix -- --fail .
      - name: Statix lint check
        run: nix run nixpkgs#statix -- check
      - name: Validate feature_list.json schema
        run: jq -e '.features | all(has("id") and has("verification") and has("state"))' feature_list.json
      - name: Flake check
        run: nix flake check

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, nixos, deployer]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Deploy entire fleet
        run: clan machines update
