# Matugen template for Starship (Gruvbox Rainbow style)
# This generates a dedicated palette file that Starship can use.

[palettes.matugen]
color_orange = "{{colors.primary.default.hex}}"
color_yellow = "{{colors.secondary.default.hex}}"
color_aqua   = "{{colors.tertiary.default.hex}}"
color_blue   = "{{colors.primary_container.default.hex}}"
color_purple = "{{colors.secondary_container.default.hex}}"
color_bg3    = "{{colors.surface_variant.default.hex}}"
color_bg1    = "{{colors.surface.default.hex}}"
color_fg0    = "{{colors.on_surface.default.hex}}"
color_green  = "{{colors.primary.default.hex}}"
color_red    = "{{colors.error.default.hex}}"
